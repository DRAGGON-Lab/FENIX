name: Native Julia M1 community
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  julia-community:
    name: Native Julia M1 community and clean archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10.13'
      - name: Instantiate locked conformance environment
        run: julia --project=conformance/julia_ode -e 'using Pkg; Pkg.instantiate()'
      - name: Native Julia M1 and M0 verification
        env:
          JULIA_PKG_OFFLINE: 'true'
        run: |
          julia --project=conformance/julia_ode packages/julia/test_native_community/runtests.jl
          julia --project=conformance/julia_ode packages/julia/test/runtests.jl
          git diff --exit-code -- conformance/julia_ode packages/julia/Project.toml
      - name: Exercise independent archived package with locked dependencies
        env:
          JULIA_PKG_OFFLINE: 'true'
        run: |
          archive=$(mktemp -d)
          git archive HEAD packages/julia conformance/julia_ode spec/community/wire-candidates spec/community/review-manifest.json conformance/community | tar -x -C "$archive"
          cd "$archive"
          julia --project=conformance/julia_ode -e 'using Pkg; Pkg.instantiate()'
          julia --project=conformance/julia_ode packages/julia/test_native_community/runtests.jl
