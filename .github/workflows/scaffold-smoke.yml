name: Scaffold smoke tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: Repository harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check agent instruction layout and documentation links
        run: python scripts/check_repo.py
      - name: Test offline harness validator
        run: python -m unittest discover -s scripts/tests -v

  python:
    name: Python-only package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python scaffold without Julia
        run: python -m pip install --no-deps -e packages/python
      - name: Python smoke checks
        run: python -m unittest discover -s packages/python/tests -v

  julia:
    name: Julia-only package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Julia smoke checks (no Python dependency)
        run: julia --project=packages/julia -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
