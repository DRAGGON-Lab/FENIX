name: Scaffold smoke tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: Repository harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
      - name: Install locked Python environment
        run: uv sync --project packages/python --locked
      - name: Check agent instruction layout and documentation links
        run: uv run --project packages/python --locked --offline python scripts/check_repo.py
      - name: Test offline harness validator
        run: uv run --project packages/python --locked --offline python -m unittest discover -s scripts/tests -v

  python:
    name: Python-only package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
      - name: Install Python scaffold without Julia
        run: uv sync --project packages/python --locked
      - name: Python smoke checks
        run: uv run --project packages/python --locked --offline python -m unittest discover -s packages/python/tests -v
      - name: Test candidate P01 catalog and report failure detection
        run: uv run --project packages/python --locked --offline python -m unittest discover -s conformance/python/tests -v
      - name: Independently validate candidate P01 fixtures in Python
        run: uv run --project packages/python --locked --offline python conformance/python/run_p01.py --report artifacts/p01-python.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p01-python
          path: artifacts/p01-python.json
      - name: Build Python distributions
        run: uv build --project packages/python
      - name: Test wheel in a clean environment without development dependencies
        run: |
          uv venv --python 3.12 /tmp/fenix-wheel
          uv pip install --python /tmp/fenix-wheel/bin/python --no-deps packages/python/dist/*.whl
          /tmp/fenix-wheel/bin/python -m unittest discover -s packages/python/tests -v

  julia:
    name: Julia-only package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10.13"
      - name: Julia smoke checks (no Python dependency)
        run: julia --project=packages/julia -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Install pinned reference tools
        run: julia --project=conformance/julia -e 'using Pkg; Pkg.instantiate()'
      - name: Load reference tools offline (not scientific conformance)
        env:
          JULIA_PKG_OFFLINE: "true"
        run: julia --project=conformance/julia -e 'using JSON, JSONSchema, SHA, Test'
      - name: Independently validate candidate P01 fixtures in Julia
        env:
          JULIA_PKG_OFFLINE: "true"
        run: julia --project=conformance/julia conformance/julia/run_p01.jl --report artifacts/p01-julia.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p01-julia
          path: artifacts/p01-julia.json
      - name: Check tracked environment files were not rewritten
        run: git diff --exit-code -- conformance/julia/Project.toml conformance/julia/Manifest.toml

  p01:
    name: Candidate P01 reference conformance
    needs: [python, julia]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          pattern: p01-*
          path: artifacts
          merge-multiple: true
      - name: Compare independent native reports against catalog expectations
        run: python conformance/compare_reports.py artifacts/p01-python.json artifacts/p01-julia.json
      - name: Independently cross-check P01 bytes and content digests
        run: node conformance/reference/check_p01.cjs
