name: Scaffold smoke tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: Repository harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
      - name: Install locked Python environment
        run: uv sync --project packages/python --locked
      - name: Check agent instruction layout and documentation links
        run: uv run --project packages/python --locked --offline python scripts/check_repo.py
      - name: Test offline harness validator
        run: uv run --project packages/python --locked --offline python -m unittest discover -s scripts/tests -v

  python:
    name: Python-only package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
      - name: Install Python package without Julia
        run: uv sync --project packages/python --locked
      - name: Python content and packaging tests
        run: uv run --project packages/python --locked --offline python -m unittest discover -s packages/python/tests -v
      - name: Check Python content style and types
        run: |
          uv run --project packages/python --locked --offline ruff check packages/python/src/fenix/bioir packages/python/src/fenix/fir packages/python/src/fenix/compiler.py packages/python/src/fenix/execution.py packages/python/tests/test_execution.py packages/python/tests/test_fir.py packages/python/tests/test_fir_validation.py packages/python/tests/test_compiler.py packages/python/tests/test_bioir.py packages/python/tests/test_json.py packages/python/tests/test_documents.py packages/python/tests_native_content packages/python/tests_native_documents packages/python/tests_native_fir
          uv run --project packages/python --locked --offline ruff format --check packages/python/src/fenix/bioir packages/python/src/fenix/fir packages/python/src/fenix/compiler.py packages/python/src/fenix/execution.py packages/python/tests/test_execution.py packages/python/tests/test_fir.py packages/python/tests/test_fir_validation.py packages/python/tests/test_compiler.py packages/python/tests/test_bioir.py packages/python/tests/test_json.py packages/python/tests/test_documents.py packages/python/tests_native_content packages/python/tests_native_documents packages/python/tests_native_fir
          uv run --project packages/python --locked --offline mypy --config-file packages/python/pyproject.toml
      - name: Test 29 approved P01 native-content projections
        run: uv run --project packages/python --locked --offline python -m unittest discover -s packages/python/tests_native_content -v
      - name: Test native P01 documents and raw inputs
        run: uv run --project packages/python --locked --offline python -m unittest discover -s packages/python/tests_native_documents -v
      - name: Test native FIR validation, normalization and compilation
        run: uv run --project packages/python --locked --offline python -m unittest discover -s packages/python/tests_native_fir -v
      - name: Test candidate P01 catalog and report failure detection
        run: uv run --project packages/python --locked --offline python -m unittest discover -s conformance/python/tests -v
      - name: Independently validate candidate P01 fixtures in Python
        run: uv run --project packages/python --locked --offline python conformance/python/run_p01.py --report artifacts/p01-python.json
      - name: Test candidate production-decay oracle and report failures
        run: uv run --project packages/python --locked --offline python -m unittest discover -s conformance/production_decay/tests -v
      - name: Audit fixed candidates with exact rational Taylor enclosures
        run: uv run --project packages/python --locked --offline python conformance/production_decay/audit_rational.py
      - name: Evaluate candidate production-decay oracle in Python
        run: uv run --project packages/python --locked --offline python conformance/production_decay/review_oracle.py --report artifacts/production-decay-python.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-decay-python
          path: artifacts/production-decay-python.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p01-python
          path: artifacts/p01-python.json
      - name: Test rejection diagnostics, catalog integrity and report failure detection
        run: uv run --project packages/python --locked --offline python -m unittest discover -s conformance/rejections/tests -v
      - name: Produce independent Python rejection report
        run: uv run --project packages/python --locked --offline python conformance/rejections/review.py --report artifacts/rejections-python.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rejections-python
          path: artifacts/rejections-python.json
      - name: Build Python distributions
        run: uv build --project packages/python
      - name: Test wheel in a clean environment without development dependencies
        run: |
          uv venv --python 3.12 /tmp/fenix-wheel
          uv export --project packages/python --locked --no-dev --no-emit-project -o /tmp/fenix-runtime.txt
          uv pip install --python /tmp/fenix-wheel/bin/python --require-hashes -r /tmp/fenix-runtime.txt
          uv pip install --python /tmp/fenix-wheel/bin/python --no-deps packages/python/dist/*.whl
          /tmp/fenix-wheel/bin/python -m unittest discover -s packages/python/tests -v

  julia:
    name: Julia-only package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10.13"
      - name: Julia smoke checks (no Python dependency)
        run: julia --project=packages/julia -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Install pinned reference tools
        run: julia --project=conformance/julia -e 'using Pkg; Pkg.instantiate()'
      - name: Load reference tools offline (not scientific conformance)
        env:
          JULIA_PKG_OFFLINE: "true"
        run: julia --project=conformance/julia -e 'using JSON, JSONSchema, SHA, Test'
      - name: Independently validate candidate P01 fixtures in Julia
        env:
          JULIA_PKG_OFFLINE: "true"
        run: julia --project=conformance/julia conformance/julia/run_p01.jl --report artifacts/p01-julia.json
      - name: Test candidate production-decay oracle in Julia
        env:
          JULIA_PKG_OFFLINE: "true"
        run: julia --project=conformance/julia conformance/production_decay/tests/test_oracle.jl
      - name: Evaluate candidate production-decay oracle in Julia
        env:
          JULIA_PKG_OFFLINE: "true"
        run: julia --project=conformance/julia conformance/production_decay/review_oracle.jl --report artifacts/production-decay-julia.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-decay-julia
          path: artifacts/production-decay-julia.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p01-julia
          path: artifacts/p01-julia.json
      - name: Test native Julia rejection diagnostics and harness boundaries
        env:
          JULIA_PKG_OFFLINE: "true"
        run: |
          julia --project=conformance/julia conformance/rejections/tests/test_reference.jl
          julia --project=conformance/julia conformance/rejections/tests/test_harness.jl
      - name: Produce independent Julia rejection report
        env:
          JULIA_PKG_OFFLINE: "true"
        run: julia --project=conformance/julia conformance/rejections/review.jl --report artifacts/rejections-julia.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rejections-julia
          path: artifacts/rejections-julia.json
      - name: Check tracked environment files were not rewritten
        run: git diff --exit-code -- conformance/julia/Project.toml conformance/julia/Manifest.toml

  p01:
    name: Candidate P01 reference conformance
    needs: [python, julia]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          pattern: p01-*
          path: artifacts
          merge-multiple: true
      - name: Compare independent native reports against catalog expectations
        run: python conformance/compare_reports.py artifacts/p01-python.json artifacts/p01-julia.json
      - name: Independently cross-check P01 bytes and content digests
        run: node conformance/reference/check_p01.cjs

  production-decay:
    name: Candidate production-decay reference agreement
    needs: [python, julia]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: production-decay-*
          path: artifacts
          merge-multiple: true
      - name: Compare all four precision runs against fixed expectations
        run: python conformance/production_decay/review_oracle.py --compare artifacts/production-decay-python.json artifacts/production-decay-julia.json

  p03:
    name: Candidate P03 serialization evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.29"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv sync --project packages/python --locked
      - run: uv run --project packages/python --locked --offline python -m unittest discover -s conformance/canonicalization/tests -v
      - run: uv run --project packages/python --locked --offline python conformance/canonicalization/review_p03.py --report artifacts/p03-python.json
      - run: node --test conformance/canonicalization/tests/test_review.cjs
      - run: node conformance/canonicalization/review_p03.cjs --report artifacts/p03-node.json
      - run: uv run --project packages/python --locked --offline python conformance/canonicalization/review_p03.py --compare artifacts/p03-python.json artifacts/p03-node.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p03-python
          path: artifacts/p03-python.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p03-node
          path: artifacts/p03-node.json

  rejections:
    name: Candidate BioIR/FIR rejection reference agreement
    needs: [python, julia]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.29"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv sync --project packages/python --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: rejections-*
          path: artifacts
          merge-multiple: true
      - name: Compare native rejection reports with fixed catalog diagnostics
        run: uv run --project packages/python --locked --offline python conformance/rejections/review.py --compare artifacts/rejections-python.json artifacts/rejections-julia.json
      - name: Independently check BioIR mutation digests
        run: node conformance/rejections/audit_inputs.cjs
