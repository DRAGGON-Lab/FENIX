[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fenix-bio"
version = "0.0.0"
description = "FENIX native Python scaffold (scientific APIs pending)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "DRAGGON Lab"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "jsonschema>=4,<5",
    "rfc8785>=0.1.4,<0.2",
]
